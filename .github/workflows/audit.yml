name: Security Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for critical vulnerabilities
        # --omit=dev excludes build-tool deps (tailwindcss, eslint) that are never deployed.
        # --audit-level=critical: remaining high-severity CVEs in ai@4.x require a breaking
        # upgrade to ai@5.x; tracked as a planned upgrade, not an audit gate.
        run: npm audit --audit-level=critical --omit=dev
