<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="body" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="100" cy="185" rx="55" ry="8" fill="#000" opacity="0.3"/>
  <!-- Main body -->
  <circle cx="100" cy="100" r="72" fill="url(#body)"/>
  <!-- Fabric texture rings -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#333" stroke-width="0.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="52" fill="none" stroke="#333" stroke-width="0.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="44" fill="none" stroke="#333" stroke-width="0.5" opacity="0.3"/>
  <!-- Alexa ring glow -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6"/>
  <!-- LED ring bottom -->
  <path d="M 62 155 A 72 72 0 0 0 138 155" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- Action button -->
  <circle cx="100" cy="55" r="6" fill="#555" stroke="#666" stroke-width="1"/>
  <!-- Volume buttons -->
  <rect x="155" y="90" width="8" height="10" rx="2" fill="#444"/>
  <rect x="155" y="104" width="8" height="10" rx="2" fill="#444"/>
  <!-- Amazon logo area -->
  <text x="100" y="108" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#888" letter-spacing="1">echo</text>
  <text x="100" y="122" text-anchor="middle" font-family="Arial" font-size="7" fill="#555" letter-spacing="2">dot</text>
</svg>
