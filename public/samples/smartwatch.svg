<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="watchband" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="50%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <radialGradient id="face" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
  </defs>
  <!-- Top band -->
  <rect x="78" y="18" width="44" height="52" rx="10" fill="url(#watchband)"/>
  <rect x="83" y="22" width="34" height="44" rx="8" fill="#222"/>
  <!-- Band perforations -->
  <circle cx="100" cy="30" r="2" fill="#111"/>
  <circle cx="100" cy="39" r="2" fill="#111"/>
  <circle cx="100" cy="48" r="2" fill="#111"/>
  <circle cx="100" cy="57" r="2" fill="#111"/>
  <!-- Bottom band -->
  <rect x="78" y="130" width="44" height="52" rx="10" fill="url(#watchband)"/>
  <rect x="83" y="134" width="34" height="44" rx="8" fill="#222"/>
  <circle cx="100" cy="143" r="2" fill="#111"/>
  <circle cx="100" cy="152" r="2" fill="#111"/>
  <circle cx="100" cy="161" r="2" fill="#111"/>
  <circle cx="100" cy="170" r="2" fill="#111"/>
  <!-- Clasp -->
  <rect x="85" y="173" width="30" height="5" rx="2.5" fill="#333" stroke="#444" stroke-width="0.5"/>
  <!-- Watch case -->
  <rect x="56" y="62" width="88" height="76" rx="22" fill="url(#bezel)"/>
  <!-- Screen area -->
  <rect x="60" y="66" width="80" height="68" rx="19" fill="url(#face)"/>
  <!-- Digital crown button -->
  <rect x="142" y="86" width="8" height="18" rx="4" fill="#5a5a5a" stroke="#666" stroke-width="0.5"/>
  <!-- Side button -->
  <rect x="142" y="108" width="8" height="10" rx="3" fill="#4a4a4a"/>
  <!-- Watch face content -->
  <!-- Time -->
  <text x="100" y="95" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" font-weight="300" fill="white">9:41</text>
  <!-- Date -->
  <text x="100" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">FRI OCT 3</text>
  <!-- Health ring indicators -->
  <circle cx="100" cy="120" r="10" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="100" cy="120" r="10" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="40 22" stroke-linecap="round" transform="rotate(-90 100 120)"/>
  <circle cx="100" cy="120" r="6.5" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="100" cy="120" r="6.5" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="28 13" stroke-linecap="round" transform="rotate(-90 100 120)"/>
  <!-- Samsung text -->
  <text x="100" y="128" text-anchor="middle" font-family="Arial" font-size="4.5" fill="#475569" letter-spacing="1.5">SAMSUNG</text>
</svg>
