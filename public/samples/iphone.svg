<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="40%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="100" cy="192" rx="42" ry="5" fill="#000" opacity="0.25"/>
  <!-- Phone body -->
  <rect x="58" y="14" width="84" height="172" rx="20" ry="20" fill="url(#frame)"/>
  <!-- Screen bezel -->
  <rect x="62" y="18" width="76" height="164" rx="17" ry="17" fill="#111"/>
  <!-- Screen -->
  <rect x="64" y="20" width="72" height="160" rx="15" ry="15" fill="url(#screen)"/>
  <!-- Dynamic Island -->
  <rect x="85" y="28" width="30" height="10" rx="5" fill="#000"/>
  <!-- Camera pill in Dynamic Island -->
  <circle cx="108" cy="33" r="3.5" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <circle cx="108" cy="33" r="2" fill="#2a2a2a"/>
  <!-- Lock screen time -->
  <text x="100" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="200" fill="white" opacity="0.9">9:41</text>
  <text x="100" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="white" opacity="0.5">Friday, October 3</text>
  <!-- App icons grid -->
  <rect x="72" y="115" width="14" height="14" rx="3" fill="#2196f3" opacity="0.7"/>
  <rect x="90" y="115" width="14" height="14" rx="3" fill="#4caf50" opacity="0.7"/>
  <rect x="108" y="115" width="14" height="14" rx="3" fill="#ff5722" opacity="0.7"/>
  <rect x="72" y="133" width="14" height="14" rx="3" fill="#9c27b0" opacity="0.7"/>
  <rect x="90" y="133" width="14" height="14" rx="3" fill="#ff9800" opacity="0.7"/>
  <rect x="108" y="133" width="14" height="14" rx="3" fill="#00bcd4" opacity="0.7"/>
  <!-- Home bar -->
  <rect x="86" y="168" width="28" height="3.5" rx="2" fill="white" opacity="0.3"/>
  <!-- Volume buttons left -->
  <rect x="55" y="68" width="5" height="18" rx="2" fill="#b0b0b0"/>
  <rect x="55" y="90" width="5" height="18" rx="2" fill="#b0b0b0"/>
  <!-- Power button right -->
  <rect x="140" y="74" width="5" height="24" rx="2" fill="#b0b0b0"/>
</svg>
