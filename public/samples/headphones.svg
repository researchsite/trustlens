<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#888" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#333" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Headband arc -->
  <path d="M 48 105 A 52 52 0 0 1 152 105" fill="none" stroke="url(#band)" stroke-width="14" stroke-linecap="round"/>
  <!-- Band highlight -->
  <path d="M 50 102 A 50 50 0 0 1 150 102" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- Left ear cup -->
  <ellipse cx="47" cy="118" rx="22" ry="28" fill="url(#cup)"/>
  <ellipse cx="47" cy="118" rx="22" ry="28" fill="url(#shine)"/>
  <ellipse cx="47" cy="118" rx="16" ry="22" fill="#1a1a1a"/>
  <ellipse cx="47" cy="118" rx="12" ry="17" fill="#0d0d0d"/>
  <!-- Left cup driver ring -->
  <ellipse cx="47" cy="118" rx="9" ry="13" fill="none" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="47" cy="118" rx="5" ry="7" fill="#181818"/>
  <!-- Right ear cup -->
  <ellipse cx="153" cy="118" rx="22" ry="28" fill="url(#cup)"/>
  <ellipse cx="153" cy="118" rx="22" ry="28" fill="url(#shine)"/>
  <ellipse cx="153" cy="118" rx="16" ry="22" fill="#1a1a1a"/>
  <ellipse cx="153" cy="118" rx="12" ry="17" fill="#0d0d0d"/>
  <!-- Right cup driver ring -->
  <ellipse cx="153" cy="118" rx="9" ry="13" fill="none" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="153" cy="118" rx="5" ry="7" fill="#181818"/>
  <!-- Sony branding hint -->
  <text x="153" y="121" text-anchor="middle" font-family="Arial" font-size="5" font-weight="bold" fill="#555" letter-spacing="0.5">SONY</text>
  <!-- Control button on right cup -->
  <circle cx="168" cy="108" r="4" fill="#333" stroke="#444" stroke-width="1"/>
  <!-- 3.5mm jack on left cup -->
  <rect x="28" y="138" width="3" height="8" rx="1.5" fill="#222"/>
  <!-- NFC indicator -->
  <circle cx="153" cy="132" r="2" fill="#1a73e8" opacity="0.6"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="60" ry="8" fill="#000" opacity="0.2"/>
</svg>
